<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found — NovelSpeak</title>
  <meta name="description" content="That page is not here. Head back to NovelSpeak, or read the source on GitHub.">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0e1318">
  <style>
    /* Self-contained on purpose: a 404 is served for unknown paths at unknown depths, so it
       cannot rely on relative asset paths. Tokens mirror site/assets/site.css. */
    :root {
      --ink: #0e1318; --ink-2: #161d24; --rule: #2c3944; --text: #f1f6fa; --text-2: #b9c6d2;
      --accent: #6fe7be; --accent-hover: #5fd6ae; --accent-ink: #06231a;
      --serif: ui-serif, "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, "Times New Roman", serif;
      --sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }
    *, *::before, *::after { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100svh; display: grid; align-content: center;
      background: var(--ink); color: var(--text); font-family: var(--sans); line-height: 1.65;
      padding: clamp(24px, 6vw, 64px);
    }
    main { width: 100%; max-width: 720px; margin-inline: auto; }
    .num { font-family: var(--mono); font-size: .72rem; letter-spacing: .14em; text-transform: uppercase; color: var(--text-2); margin: 0 0 16px; }
    h1 { font-family: var(--serif); font-weight: 500; font-size: clamp(2.2rem, 1.4rem + 4vw, 3.6rem); line-height: 1.05; letter-spacing: -.02em; margin: 0 0 16px; overflow-wrap: anywhere; }
    p { margin: 0 0 24px; color: var(--text-2); max-width: 44ch; }
    .actions { display: flex; flex-wrap: wrap; gap: 12px; margin-bottom: 32px; }
    .btn { display: inline-flex; align-items: center; min-height: 46px; padding: 12px 24px; border-radius: 10px; font-weight: 500; text-decoration: none; }
    .btn--primary { background: var(--accent); color: var(--accent-ink); }
    .btn--primary:hover { background: var(--accent-hover); }
    .btn--ghost { border: 1px solid var(--rule); color: var(--text); }
    .btn--ghost:hover { background: var(--ink-2); }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
    .btn--primary:focus-visible { outline-color: var(--accent-ink); }
    .legal { font-size: .875rem; color: var(--text-2); border-top: 1px solid var(--rule); padding-top: 16px; margin: 0; }
  </style>
</head>
<body>
<main id="main">
  <p class="num">404 — not found</p>
  <h1>That page is not here.</h1>
  <p>The link may be old, or the chapter may have moved. The app is still where you left it.</p>
  <div class="actions">
    <a class="btn btn--primary" id="home" href="https://vipulgote1999.github.io/NovelSpeak/">Home</a>
    <a class="btn btn--ghost" href="https://github.com/vipulgote1999/NovelSpeak">Source and releases</a>
  </div>
  <p class="legal">NovelSpeak — a quiet Android reader that speaks.</p>
</main>
<script>
  // The 404 is served at any depth, so the home link cannot be relative. Resolve it once.
  (function () {
    var home = document.getElementById('home');
    if (!home) return;
    var path = window.location.pathname;
    if (path.indexOf('/NovelSpeak/') === 0) home.href = '/NovelSpeak/';
    else if (!window.location.hostname.endsWith('github.io')) home.href = '/';
  })();
</script>
</body>
</html>
