<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NovelSpeak — read web novels aloud</title>
  <style>
    :root { color-scheme: dark; --bg:#0e1318; --surface:#161d24; --border:#2c3944; --text:#f1f6fa; --muted:#9aa9b8; --accent:#6fe7be; }
    * { box-sizing: border-box; }
    body { margin:0; background:var(--bg); color:var(--text); font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif; }
    main { max-width:760px; margin:0 auto; padding:72px 22px; }
    h1 { font-size:clamp(2.2rem,7vw,4rem); line-height:1.05; margin:0 0 12px; letter-spacing:-0.03em; }
    p { color:var(--muted); font-size:1.1rem; }
    a { color:var(--accent); }
    .card { margin-top:28px; padding:22px; background:var(--surface); border:1px solid var(--border); border-radius:18px; }
    ul { padding-left:20px; }
    li { margin:8px 0; color:var(--text); }
  </style>
</head>
<body>
<main>
  <h1>NovelSpeak</h1>
  <p>Read web novels aloud. Offline neural voices. Screen off. No account, no ads, no telemetry.</p>
  <div class="card">
    <ul>
      <li><a href="./privacy/">Privacy policy</a> — what stays on your device and what leaves it.</li>
      <li><a href="https://github.com/vipulgote1999/NovelSpeak">Source code and issue tracker</a></li>
      <li><a href="https://github.com/vipulgote1999/NovelSpeak/releases">Release notes and APKs</a></li>
    </ul>
  </div>
</main>
</body>
</html>
