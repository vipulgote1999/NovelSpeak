appId: app.novelspeak
name: "02 settings: hub categories open a subpage and back returns"
tags:
  - baseline
  - smoke
---
- launchApp
- tapOn: "More options"
- assertVisible: "NovelSpeak settings"
- tapOn: "NovelSpeak settings"
- assertVisible: "Settings"
- scrollUntilVisible:
    element:
      text: "Reading aloud"
    direction: UP
    timeout: 15000
- assertVisible: "Reading aloud"
- assertVisible: "Voices & previews"
- assertVisible: "Playback & sleep"
- assertVisible: "Reading & display"
- scrollUntilVisible:
    element:
      text: "Privacy & data"
    direction: DOWN
    timeout: 15000
- assertVisible: "Privacy & data"
- assertVisible: "Advanced"
- scrollUntilVisible:
    element:
      text: "Changes are saved instantly.*"
    direction: DOWN
    timeout: 15000
- assertVisible: "Changes are saved instantly.*"
- scrollUntilVisible:
    element:
      text: "Reading aloud"
    direction: UP
    timeout: 15000
- tapOn: "Reading aloud"
- assertVisible: "Engine & models"
- assertVisible: "Speech engine"
- assertVisible: "Neural model"
- tapOn: "Back"
- assertVisible: "Reading aloud"
- tapOn: "Back"
- assertVisible: "Shortcuts"