appId: app.novelspeak
name: "07 library: opened chapter appears and reopens"
tags: [library]
---
- launchApp
- tapOn: "Edit address"
- eraseText: 200
- inputText: "http://localhost:8765/chapter1.html"
- pressKey: Enter
- extendedWaitUntil:
    visible: "Address bar, http://localhost:8765/chapter1.html"
    timeout: 15000
- tapOn: "Read"
- extendedWaitUntil:
    visible: "Sentence [0-9]+ of [0-9]+"
    timeout: 30000
- tapOn: "More options"
- tapOn: "Library"
- assertVisible: "The Lamplighter.*"
- tapOn: "The Lamplighter.*"
- extendedWaitUntil:
    visible: "Sentence [0-9]+ of [0-9]+"
    timeout: 20000
