appId: app.novelspeak
name: "15 next fallback: chapter URLs without a next anchor still advance"
tags:
  - reader
  - regression
---
- launchApp
- runFlow:
    when:
      visible: "Home search"
    commands:
      - tapOn: "Home search"
- runFlow:
    when:
      visible: "Edit address"
    commands:
      - tapOn: "Edit address"
- eraseText: 200
- inputText: "http://localhost:8765/novel/demo/1/"
- pressKey: Enter
- extendedWaitUntil:
    visible: "Address bar, http://localhost:8765/novel/demo/1/"
    timeout: 15000
- extendedWaitUntil:
    visible: "Read chapter"
    timeout: 20000
- tapOn: "Read chapter"
- extendedWaitUntil:
    visible: "Sentence [0-9]+ of [0-9]+"
    timeout: 30000
- tapOn: "Next chapter"
- extendedWaitUntil:
    visible: "Address bar, http://localhost:8765/novel/demo/2/"
    timeout: 30000
