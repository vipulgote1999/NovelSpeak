appId: app.novelspeak
name: "18 settings hub: every category opens and returns"
tags:
  - settings
  - regression
---
- launchApp
- tapOn: "More options"
- tapOn: "NovelSpeak settings"
- assertVisible: "Reading aloud"
- assertVisible: "Voices & previews"
- assertVisible: "Playback & sleep"
- assertVisible: "Reading & display"
- scrollUntilVisible:
    element:
      text: "Story cast"
    direction: DOWN
    timeout: 15000
- assertVisible: "Story cast"
- tapOn: "Playback & sleep"
- assertVisible: "Speed"
- assertVisible: "Sleep timer"
- tapOn: "Back"
- tapOn: "Reading & display"
- assertVisible: "Reader appearance"
- tapOn: "Back"
- scrollUntilVisible:
    element:
      text: "Advanced"
    direction: DOWN
    timeout: 15000
- tapOn: "Advanced"
- assertVisible: "Performance"
- assertVisible: "Reset to tuned defaults"
- tapOn: "Back"
- scrollUntilVisible:
    element:
      text: "Privacy & data"
    direction: DOWN
    timeout: 15000
- tapOn: "Privacy & data"
- scrollUntilVisible:
    element:
      text: "Ad blocking"
    direction: DOWN
    timeout: 20000
- assertVisible: "Ad blocking"
- tapOn: "Back"
- scrollUntilVisible:
    element:
      text: "About NovelSpeak"
    direction: DOWN
    timeout: 15000
- assertVisible: "About NovelSpeak"
