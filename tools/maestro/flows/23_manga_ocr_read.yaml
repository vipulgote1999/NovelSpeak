appId: app.novelspeak
name: "23 manga: sample OCR + chunk tracking"
tags:
  - manga
---
- launchApp
- assertVisible: "NovelSpeak"
- scrollUntilVisible:
    element: "Manga"
    direction: DOWN
- tapOn: "Manga"
- assertVisible: "OCR + READ"
- tapOn: "SAMPLE"
- assertVisible: "Sample loaded. Tap OCR + READ."