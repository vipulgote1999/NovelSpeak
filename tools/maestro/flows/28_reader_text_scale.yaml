appId: app.novelspeak
name: "28 reader at 2x: the player controls and voice shortcut stay reachable"
tags:
  - ui
  - a11y
  - reader
---
- launchApp
- runFlow:
    when:
      visible: "Home search"
    commands:
      - tapOn: "Home search"
- runFlow:
    when:
      visible: "Edit address"
    commands:
      - tapOn: "Edit address"
- eraseText: 200
- inputText: "http://localhost:8765/chapter1.html"
- pressKey: Enter
- extendedWaitUntil:
    visible: "Address bar, http://localhost:8765/chapter1.html"
    timeout: 15000
- extendedWaitUntil:
    visible: "Sentence [0-9]+ of [0-9]+|Restart chapter"
    timeout: 30000
- assertVisible: "Current voice.*Open voice settings"
- assertVisible: "Sleep timer"
- assertVisible: "Next chapter"
- tapOn: "Sleep timer"
- tapOn: "15 minutes"
- extendedWaitUntil:
    visible: "Sleep timer active.*"
    timeout: 10000
