appId: app.novelspeak
name: "07 library: opened chapter appears with progress and resumes"
tags:
  - pending
  - library
---
- launchApp
- tapOn: "Edit address"
- eraseText: 200
- inputText: "http://localhost:8765/chapter1.html"
- pressKey: Enter
- extendedWaitUntil:
    visible: "Address bar, http://localhost:8765/chapter1.html"
    timeout: 15000
- tapOn: "Read"
- extendedWaitUntil:
    visible: "Sentence [0-9]+ of [0-9]+"
    timeout: 30000
- tapOn: "Next ch"
- extendedWaitUntil:
    visible: "Address bar, http://localhost:8765/chapter2.html"
    timeout: 30000
# Library entry is recorded post-extraction.
- tapOn: "More options"
- tapOn: "Library"
- assertVisible: "Library"
- assertVisible: "Library entry"
- assertVisible: "Chapter Two.*"
- assertVisible: ".*[0-9]+%.*"
- tapOn: "Library entry"
- extendedWaitUntil:
    visible: "Address bar, http://localhost:8765/chapter2.html"
    timeout: 20000
- assertVisible: "Sentence [0-9]+ of [0-9]+"
# Persistence after a process restart.
- launchApp
- tapOn: "More options"
- tapOn: "Library"
- assertVisible: "Library entry"
- assertVisible: "Chapter Two.*"
