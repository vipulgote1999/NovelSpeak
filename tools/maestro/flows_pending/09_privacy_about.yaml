appId: app.novelspeak
name: "09 privacy: Settings -> Open privacy -> Privacy & licences -> back"
tags:
  - pending
  - privacy
---
- launchApp
- tapOn: "More options"
- tapOn: "NovelSpeak settings"
- assertVisible: "Settings"
- scrollUntilVisible:
    element:
      text: "Open privacy"
    direction: DOWN
    timeout: 20000
- tapOn: "Open privacy"
- assertVisible: "Privacy & licences"
- assertVisible: "PRIVACY"
- assertVisible: ".*no analytics.*"
- assertVisible: "Back"
- tapOn: "Back"
- assertVisible: "Settings"
