    <script>
      (function () {
        "use strict";

        var root = document.getElementById("root");
        var card = document.getElementById("so-card");
        var sheen = document.getElementById("so-sheen");
        var h1 = document.getElementById("so-h1");
        var h2 = document.getElementById("so-h2");
        var caption = document.getElementById("so-caption");
        var mask1 = h1.parentElement;
        var mask2 = h2.parentElement;

        mask1.style.overflow = "hidden";
        mask2.style.overflow = "hidden";

        // initial states
        card.style.filter = "brightness(0.84)";
        card.style.transform = "translateY(60px)";
        gsap.set(card, { opacity: 0 });
        gsap.set(h1, { yPercent: 100, opacity: 1 });
        gsap.set(h2, { yPercent: 100, opacity: 1 });
        gsap.set(caption, { opacity: 0 });
        gsap.set(sheen, { x: -400, opacity: 1 });

        var bright = { v: 0.84 };
        function applyBright() {
          card.style.filter = "brightness(" + bright.v + ")";
        }

        var tl = gsap.timeline({ paused: true });

        // 0.0 card rises 60px + opacity 0->1 (0.75s, expo.out), dimmed 84%
        tl.to(card, { y: 0, opacity: 1, duration: 0.75, ease: "expo.out" }, 0);

        // 0.2 "Screen off." mask-rises
        tl.to(h1, { yPercent: 0, duration: 0.6, ease: "power3.out" }, 0.2);

        // 0.85 card brightness ->100% + mint sheen sweep (0.55s)
        tl.to(bright, { v: 1, duration: 0.4, ease: "power2.out", onUpdate: applyBright }, 0.85);
        tl.fromTo(sheen, { x: -400 }, { x: 1350, duration: 0.55, ease: "power2.inOut" }, 0.85);
        tl.set(sheen, { opacity: 0 }, 0.85 + 0.55);

        // 1.0 "Still reading." mask-rises in mint
        tl.to(h2, { yPercent: 0, duration: 0.6, ease: "power3.out" }, 1.0);

        // 1.6 caption fades

        // 1.8-3.0 hold perfectly still

        tl.seek(0);
        window.__timelines = window.__timelines || {};
        window.__timelines["05-screenoff"] = tl;
